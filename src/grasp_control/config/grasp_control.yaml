grasp_control_node:
  ros__parameters:
    base_frame: base_link
    move_group_name: arm
    end_effector_link: end_effector_link

    # Verified on the EATED TurtleBot3 + OpenMANIPULATOR-X hardware.
    home_on_startup: true
    home_pose_deg: [0.0, -101.0, 53.0, 70.0]
    recognition_pose_deg: [0.0, -19.0, 0.0, 75.0]
    cargo_pose_deg: [-73.0, -30.0, 38.0, -10.0]
    joint_motion_duration_sec: 4.0
    recognition_settle_sec: 0.5

    gripper_open_position: 0.019
    gripper_closed_position: -0.010
    gripper_max_effort: 0.2
    grasp_position_threshold: -0.008

    # The PCA grasp point differs from EATED's bounding-box center, so the old
    # +2 cm X calibration is intentionally not copied.
    pick_calibration_xyz_m: [0.02, 0.0, 0.045]
    pregrasp_offset_xyz_m: [0.0, 0.0, 0.05]
    retreat_offset_z_m: 0.15
    pick_orientation_xyzw: [0.0, 0.7071068, 0.0, 0.7071068]

    position_tolerance_m: 0.01
    moveit_planning_time_sec: 3.0
    moveit_velocity_scale: 0.10
    moveit_acceleration_scale: 0.10
    approach_cartesian_step_m: 0.005
    approach_joint_jump_rad: 0.35
    retreat_cartesian_step_m: 0.005
    retreat_joint_jump_rad: 0.35
    action_server_timeout_sec: 10.0
    action_result_timeout_sec: 20.0

    pose_wait_timeout_sec: 10.0
    pose_max_age_sec: 0.5
    tf_timeout_sec: 0.2
    stable_sample_count: 5
    max_position_stddev_m: 0.005

    # Conservative initial limits; verify against the real table and mount.
    workspace_min_xyz_m: [0.05, -0.30, 0.00]
    workspace_max_xyz_m: [0.45, 0.30, 0.45]
    return_home_on_error: true
    max_orientation_residual_deg: 30.0

grasp_router_node:
  ros__parameters:
    candidate_timeout_sec: 10.0
    enable_keyboard_menu: true
