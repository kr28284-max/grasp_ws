yolo_seg_node:
  ros__parameters:
    model_path: /home/user/grasp_ws/weights/best_openvino_model
    rgb_topic: /realsense/d435i/color/image_raw
    depth_topic: /realsense/d435i/aligned_depth_to_color/image_raw
    camera_info_topic: /realsense/d435i/color/camera_info
    camera_optical_frame: d435i_color_optical_frame
    base_frame: base_link
    table_roi_u_min: 0.10
    table_roi_u_max: 0.90
    table_roi_v_min: 0.20
    table_roi_v_max: 0.95
    table_depth_min: 0.10
    table_depth_max: 1.00
    table_object_margin_px: 12
    table_pixel_stride: 3

table_plane_node:
  ros__parameters:
    base_frame: base_link
    table_frame: table_frame
    min_points: 100
    ransac_iterations: 150
    distance_threshold: 0.004
    min_inlier_ratio: 0.45
    stability_window: 8
    min_stable_samples: 5
    max_normal_deviation_deg: 3.0
    max_table_tilt_deg: 5.0
    max_height_std: 0.008
    marker_size: 0.40

pose_estimation_node:
  ros__parameters:
    min_points: 30
    base_frame: base_link
    table_sync_slop_sec: 0.05
    tf_timeout_sec: 0.15
    duplo_height_tolerance: 0.012
    duplo_height_ambiguity_margin: 0.002
    duplo_length: 0.0631
    duplo_width: 0.0310
    duplo_height: 0.0231
    duplo_center_offset: 0.0115
    hammer_length: 0.262
    hammer_head_width: 0.081
